test_name: illustrasjonskart kommuner, sjekk noen kommuner fordi noen av de ble ekskludert tidligere pga problemer med polygonkonstruksjonen

strict:
  - headers:off
  - json:off

stages:
  - name: get
    request:
      url: "{tavern.env_vars.TAVERN_TEST_URL}/kommuner/illustrasjonskart"
      params: {'utkoordsys': 25833}
      method: GET
      headers:
        content-type: application/json
    response:
      status_code: 200
      headers:
        content-length: !re_fullmatch "16[4-6]{1}[0-9]{3}"
      json:
        type: "FeatureCollection"
        features:
          - properties:
              kommunenavn: 'Nittedal'
              kommunenavn: 'Bærum'
              kommunenavn: 'Tromsø'
              kommunenavn: 'Oslo'
              kommunenavn: 'Sandefjord'
              kommunenavn: 'Ås'

