test_name: Sjekk at punktsøk fungerer

strict:
  - headers:off
  - json:on

stages:
  - name: get
    request:
      url: "{tavern.env_vars.TAVERN_TEST_URL}/punkt"
      params:
        nord: 59.9
        ost: 10.7
        koordsys: 4258
      method: GET
      headers:
        content-type: application/json
    response:
      status_code: 200
      json:
        fylkesnavn: "Oslo"
        fylkesnummer: "03"
        kommunenavn: "Oslo"
        kommunenummer: "0301"

