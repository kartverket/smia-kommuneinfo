test_name: Kåfjord. 3 skrivemåter. Sjekker alle returparametere.

strict:
  - headers:off
  - json:on

stages:
  - name: get
    request:
      url: "{tavern.env_vars.TAVERN_TEST_URL}/kommuner/5540"
      params:
        utkoordsys: 4258
      method: GET
      headers:
        content-type: application/json
    response:
      status_code: 200
      json:
        avgrensningsboks:
          coordinates: !anything
          crs:
            properties:
              name: "EPSG:4258"
            type: "name"
          type: "Polygon"
        fylkesnavn: "Troms"
        fylkesnummer: "55"
        gyldigeNavn:
          - navn: "Gáivuotna"
            prioritet: 1
            sprak: "Northern Sami"
          - navn: "Kåfjord"
            prioritet: 2
            sprak: "Norwegian"
          - navn: "Kaivuono"
            prioritet: 3
            sprak: "Kven Finnish"
        kommunenavn: "Gáivuotna"
        kommunenavnNorsk: "Kåfjord"
        kommunenummer: "5540"
        punktIOmrade:
          coordinates: !anything
          crs:
            properties:
              name: "EPSG:4258"
            type: "name"
          type: "Point"
        samiskForvaltningsomrade: true


